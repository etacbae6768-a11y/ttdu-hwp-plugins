# Publish all three packages to PyPI when a GitHub release is published (tag vX.Y.Z).
# Uses PyPI Trusted Publishing (OIDC): no API token is stored in this repository.
# PyPI needs a different publisher configuration for each new project, so each package is
# uploaded by its own job with its own GitHub environment. Publishers registered on PyPI
# (owner etacbae6768-a11y, repository ttdu-hwp-plugins, workflow publish.yml):
#   ttdu-hwp             -> environment pypi
#   markitdown-ttdu-hwp  -> environment pypi-markitdown
#   docling-ttdu-hwp     -> environment pypi-docling
# ttdu-hwp is uploaded first so the plugins can resolve their dependency right away.
# workflow_dispatch re-runs the upload (for example after a failed job); PyPI refuses files that already exist.
name: publish
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check versions match the tag
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in packages/ttdu-hwp/src/ttdu_hwp/__init__.py packages/markitdown-ttdu-hwp/src/markitdown_ttdu_hwp/__init__.py packages/docling-ttdu-hwp/src/docling_ttdu_hwp/__init__.py; do
            v=$(grep -Po '^__version__ = "\K[^"]+' "$f")
            [ "$v" = "$tag" ] || { echo "$f has $v, tag is $tag"; exit 1; }
          done
      - name: Unit tests
        run: |
          pip install pytest markitdown docling-core -e packages/ttdu-hwp -e packages/markitdown-ttdu-hwp -e packages/docling-ttdu-hwp
          pytest -q tests
      - name: Build
        run: |
          pip install build twine
          for p in ttdu-hwp markitdown-ttdu-hwp docling-ttdu-hwp; do python -m build "packages/$p" -o dist; done
          twine check dist/*
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-ttdu-hwp:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ttdu-hwp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: mkdir up && mv dist/ttdu_hwp-* up/ && ls -l up
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: up/

  publish-markitdown-ttdu-hwp:
    needs: publish-ttdu-hwp
    runs-on: ubuntu-latest
    environment:
      name: pypi-markitdown
      url: https://pypi.org/project/markitdown-ttdu-hwp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: mkdir up && mv dist/markitdown_ttdu_hwp-* up/ && ls -l up
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: up/

  publish-docling-ttdu-hwp:
    needs: publish-ttdu-hwp
    runs-on: ubuntu-latest
    environment:
      name: pypi-docling
      url: https://pypi.org/project/docling-ttdu-hwp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: mkdir up && mv dist/docling_ttdu_hwp-* up/ && ls -l up
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: up/