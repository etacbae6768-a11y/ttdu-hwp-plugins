[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markitdown-ttdu-hwp"
dynamic = ["version"]
description = "MarkItDown plugin for HWP/HWPX (Korean word processor) files, using the Tools That Don't Upload API or its offline local runner"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Tools That Don't Upload" }]
keywords = ["markitdown", "markitdown-plugin", "hwp", "hwpx", "hangul", "korean", "markdown", "llm", "rag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: Korean",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = ["markitdown>=0.1.0", "ttdu-hwp>=0.1.0,<0.2"]

[project.urls]
Documentation = "https://toolsthatdontupload.com/docs/hwp/"

[project.entry-points."markitdown.plugin"]
ttdu_hwp = "markitdown_ttdu_hwp"

[tool.hatch.version]
path = "src/markitdown_ttdu_hwp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/markitdown_ttdu_hwp"]
