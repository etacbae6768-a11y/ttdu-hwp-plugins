[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ttdu-hwp"
dynamic = ["version"]
description = "HWP/HWPX to text, Markdown and DOCX via the Tools That Don't Upload API or its offline local runner (thin client, no parser inside)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Tools That Don't Upload" }]
keywords = ["hwp", "hwpx", "hangul", "korean", "markdown", "docx", "document-conversion"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: Korean",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []

[project.urls]
Documentation = "https://toolsthatdontupload.com/docs/hwp/"
Repository = "https://github.com/etacbae6768-a11y/ttdu-hwp-plugins"
Issues = "https://github.com/etacbae6768-a11y/ttdu-hwp-plugins/issues"

[project.scripts]
ttdu-hwp = "ttdu_hwp.__main__:main"

[tool.hatch.version]
path = "src/ttdu_hwp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ttdu_hwp"]
